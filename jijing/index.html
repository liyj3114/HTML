<style>
:root{
  --paper:#F4F5F2;
  --surface:#FFFFFF;
  --ink:#181A20;
  --ink-2:#4A515C;
  --ink-3:#8B929C;
  --line:#E3E5DF;
  --line-2:#EDEEEA;
  --accent:#E2542B;
  --accent-soft:#FBEDE6;
  --radius:14px;
  --shadow:0 1px 2px rgba(24,26,32,.04),0 10px 28px -16px rgba(24,26,32,.18);
  --serif:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:rgba(244,245,242,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;position:relative}
.brand .mark::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--accent)}
.brand .name{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.4px;white-space:nowrap}
.search{flex:1;max-width:440px;margin-left:auto;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.search input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--sans);font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,84,43,.12)}
.search input::placeholder{color:var(--ink-3)}
.topbar .count{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}

/* Hero */
.hero{max-width:1180px;margin:0 auto;padding:52px 24px 22px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--ink-2);font-weight:600}
.hero .eyebrow::before{content:"";width:22px;height:1.5px;background:var(--accent)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5vw,50px);line-height:1.2;margin:14px 0 12px;letter-spacing:.5px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{max-width:600px;color:var(--ink-2);font-size:15px;font-weight:300}
.hero .lede b{font-weight:600;color:var(--ink)}

/* 分类筛选 */
.filters{max-width:1180px;margin:0 auto;padding:8px 24px 10px;position:sticky;top:58px;z-index:40;background:linear-gradient(var(--paper) 78%,rgba(244,245,242,0));padding-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;color:var(--ink-2);transition:all .15s;user-select:none}
.chip .c{font-size:11px;color:var(--ink-3);background:var(--paper);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.on .c{background:rgba(255,255,255,.16);color:var(--paper)}
.chip.all{font-weight:600}

/* 分区与卡片 */
main{max-width:1180px;margin:0 auto;padding:10px 24px 70px}
.section{margin-top:40px;scroll-margin-top:150px}
.section-head{display:flex;align-items:center;gap:13px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:20px}
.section-head .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.section-head .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.section-head h2{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.4px}
.section-head .c{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
/* 避免孤儿卡片：最后一张若单独成行，横跨整行 */
.grid > .card:last-child:nth-child(3n+1){grid-column:1/-1}
.grid > .card:last-child:nth-child(3n+1) h3{font-size:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px -16px rgba(24,26,32,.28);border-color:#d2d5cd}
.card .top{display:flex;align-items:center;gap:7px}
.ttype{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:500;letter-spacing:.3px;display:inline-flex;align-items:center;gap:4px}
.ttype.video{background:var(--ink);color:var(--paper)}
.ttype.page{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.ttype svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:14.5px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px}
.domain{font-size:12px;color:var(--ink-3);background:var(--paper);border:1px solid var(--line-2);padding:2px 9px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.act{display:flex;gap:5px;margin-left:auto}
.ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);display:grid;place-items:center;transition:all .15s;position:relative}
.ibtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
.card .link-open{position:absolute;inset:0;border-radius:var(--radius);z-index:1}
.card .ibtn{z-index:2}

/* 空态 */
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--ink-3)}
.empty .big{font-family:var(--serif);font-size:28px;color:var(--ink-2);margin-bottom:8px}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:1180px;margin:0 auto;padding:30px 24px 46px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;color:var(--ink-3);font-size:12.5px}

.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;padding:10px 16px;gap:10px}
  .search{order:3;max-width:100%;flex-basis:100%;margin:0}
  .topbar .count{display:none}
  .hero{padding:38px 18px 16px}
  .filters{padding-left:18px;padding-right:18px;top:52px}
  main{padding-left:16px;padding-right:16px}
  .grid{grid-template-columns:1fr}
  .section-head h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  grad:'<path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11v4c0 1.5 2.7 3 6 3s6-1.5 6-3v-4"/><path d="M22 9v5"/>',
  book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h7z"/>',
  library:'<path d="M4 19V5M10 19V5M16 19V5M2 19h20"/><path d="M7 19v-3M13 19v-3"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  code:'<path d="m8 7-5 5 5 5M16 7l5 5-5 5M13 5l-2 14"/>',
  tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.8-2.8z"/>',
  music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  puzzle:'<path d="M10 4a2 2 0 0 1 4 0v1h4a1 1 0 0 1 1 1v4h1a2 2 0 0 1 0 4h-1v4a1 1 0 0 1-1 1h-4v1a2 2 0 0 1-4 0v-1H5a1 1 0 0 1-1-1v-4H3a2 2 0 0 1 0-4h1V6a1 1 0 0 1 1-1h4z"/>',
  palette:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.5 0 2-1 1.5-2s-.5-2 .5-2H17a4 4 0 0 0 3.6-2.4A9 9 0 0 0 12 3z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="10.5" r="1"/>',
  cloud:'<path d="M17.5 18a4.5 4.5 0 0 0 .4-9A6 6 0 0 0 6 11a4 4 0 0 0 .5 7h11z"/><path d="M12 13v5M12 18l-2-2M12 18l2-2"/>',
  film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  crystal:'<path d="M12 3l7 4-7 4-7-4z"/><path d="M5 7v6l7 4 7-4V7"/><path d="M12 17v4"/>',
  coins:'<circle cx="9" cy="9" r="6"/><path d="M15 9a6 6 0 0 1-6 6c2 2 5 2 8 0a6 6 0 0 0-2-6z"/>',
  tag:'<path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1"/>'
};

/* 组装数据：扁平化，去掉任何状态字段 */
const CATS = CATMETA.map(m=>m.name);
const items = DATA.map(d=>({cat:d[0], title:d[1], url:d[2], type:d[3]||"网页"}));
const byCat = {};
items.forEach(it=>{ (byCat[it.cat]=byCat[it.cat]||[]).push(it); });

let curCat = "all";
let query = "";

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* 分类筛选 chip */
function renderChips(){
  const box = document.getElementById("chips");
  let html = '<button class="chip all'+(curCat==="all"?" on":"")+'" data-cat="all">全部<span class="c">'+items.length+'</span></button>';
  CATS.forEach(c=>{
    const n=byCat[c]?byCat[c].length:0;
    if(!n) return;
    html += '<button class="chip'+(curCat===c?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="c">'+n+'</span></button>';
  });
  box.innerHTML = html;
  box.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{ curCat = ch.dataset.cat; renderChips(); render(); });
  });
}

/* 卡片 */
function cardHtml(it){
  const meta = CATMETA.find(m=>m.name===it.cat) || CATMETA[CATMETA.length-1];
  const isVideo = it.type==="视频";
  const icon = ICONS[meta.icon] || ICONS.tag;
  return '<article class="card">'
    + '<a class="link-open" href="'+esc(it.url)+'" target="_blank" rel="noopener" aria-label="'+esc(it.title)+'"></a>'
    + '<div class="top">'
    +   '<span class="ttype '+(isVideo?"video":"page")+'">'+(isVideo?'<svg viewBox="0 0 24 24"><path d="M6 4l12 8-12 8z"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>')+(isVideo?"视频":"网页")+'</span>'
    + '</div>'
    + '<h3>'+esc(it.title)+'</h3>'
    + '<div class="foot">'
    +   '<span class="domain">'+esc(it.url.replace(/^https?:\/\//,"").split("/")[0])+'</span>'
    +   '<div class="act"><button class="ibtn" data-copy aria-label="复制链接" title="复制链接"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>'
    + '</div>'
    + '</article>';
}

function render(){
  const main = document.getElementById("sections");
  const q = query.trim().toLowerCase();
  let total = 0;
  let html = "";
  const catsShown = curCat==="all" ? CATS : [curCat];
  catsShown.forEach(c=>{
    let list = byCat[c]||[];
    if(q){ list = list.filter(it=> (it.title+" "+it.url+" "+it.cat).toLowerCase().includes(q)); }
    if(!list.length) return;
    const meta = CATMETA.find(m=>m.name===c)||CATMETA[0];
    total += list.length;
    html += '<section class="section" id="sec-'+esc(c)+'">'
      + '<div class="section-head">'
      +   '<div class="ic" style="background:'+meta.color+'">'+ICONS[meta.icon]+'</div>'
      +   '<h2>'+esc(c)+'</h2><span class="c">'+list.length+' 条</span>'
      + '</div><div class="grid">';
    html += list.map(cardHtml).join("");
    html += '</div></section>';
  });
  main.innerHTML = html || '<div class="empty"><div class="big">没有找到匹配的内容</div><div>换个关键词试试</div></div>';
  document.getElementById("count").textContent = q ? "匹配 "+total+" 条" : (curCat==="all" ? "共 "+items.length+" 条" : total+" 条");
  document.getElementById("fCount").textContent = "共 "+items.length+" 条收藏 · "+CATS.length+" 个分类";
  main.querySelectorAll(".card .ibtn").forEach(b=>{
    b.addEventListener("click",e=>{
      e.preventDefault(); e.stopPropagation();
      const url = b.closest(".card").querySelector(".link-open").href;
      navigator.clipboard.writeText(url).then(()=>toast("链接已复制"));
    });
  });
}

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}

document.getElementById("search").addEventListener("input",e=>{ query=e.target.value; render(); });

/* 统计 */
document.getElementById("hTotal").textContent = items.length;
document.getElementById("hCat").textContent = CATS.length;

renderChips();
render();
</script>
</body>
</html>
